# minds-aligned.org (Netlify site minds-aligned-soma, 3dac5361-f1a6-4027-b57c-261984c1371d).
#
# The site is git-linked to eldrgeek/minds-aligned with BASE DIRECTORY hub-public, so
# Netlify reads THIS file, not the repo-root netlify.toml (which builds the AGI-26 hub,
# a different site). A push to master publishes hub-public as-is: no build step.
#
# Functions live OUTSIDE the publish directory, so their source is not served as a
# static file: copy-canonize.mjs (SOMA §17 Live Edit publish) and soma-feedback.cjs
# (the feedback chip's same-origin proxy; .cjs because the repo's package.json says
# "type": "module").
#
# No `ignore` command, on purpose. One was tried on 2026-09-16 (skip the deploy when a
# push touches neither hub-public nor its functions). Netlify compares against the last
# CACHED build, not the live deploy. So when a Live Edit change put a file back exactly
# as it was two builds earlier, the deploy was cancelled as "no content change" and the
# previous wording stayed live. A deploy here has no build step and takes about 16 seconds.
#
# Added 2026-09-16 (Mike Wolf's estate; Claude Opus 5, CCc).
[build]
  publish = "."
  command = ""
  functions = "../hub-public-functions"
