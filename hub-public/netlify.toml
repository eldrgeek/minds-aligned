# minds-aligned.org (Netlify site minds-aligned-soma, 3dac5361-f1a6-4027-b57c-261984c1371d).
#
# The site is git-linked to eldrgeek/minds-aligned with BASE DIRECTORY hub-public, so
# Netlify reads THIS file, not the repo-root netlify.toml (which builds the AGI-26 hub,
# a different site). A push to master publishes hub-public as-is: no build step.
#
# Functions live OUTSIDE the publish directory, so their source is not served as a
# static file: copy-canonize.mjs (SOMA §17 Live Edit publish) and soma-feedback.cjs
# (the feedback chip's same-origin proxy; .cjs because the repo's package.json says
# "type": "module").
#
# `ignore = "exit 1"` means ALWAYS DEPLOY, and it is load-bearing. With a base directory
# set and no ignore command, Netlify runs its own check: `git diff` between the last
# CACHED build's commit and this one, limited to the base directory, and cancels the
# deploy as "no content change" when that diff is empty. It compares with the cached
# build, not with the live deploy. Found 2026-09-16 in the Live Edit end-to-end test:
# an edit deployed, then the restore put hub-public/index.html back byte-for-byte as it
# was one build earlier, the restore's deploy was cancelled, and the test wording stayed
# live. Any owner who edits a sentence and then changes their mind hits the same thing.
# A deploy here has no build step and takes about 16 seconds, so always deploying costs
# nothing worth saving.
#
# Added 2026-09-16 (Mike Wolf's estate; Claude Opus 5, CCc).
[build]
  publish = "."
  command = ""
  functions = "../hub-public-functions"
  ignore = "exit 1"
